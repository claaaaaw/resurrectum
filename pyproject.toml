[project]
name = "resurrectum"
version = "0.1.0"
description = "Resurrectum - Soul Immortality for AI Agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "argon2-cffi>=23.1.0",
  "boto3>=1.34.0",
  "click>=8.1.0",
  "cryptography>=42.0.0",
  "jsonschema>=4.21.0",
  "rfc8785>=0.1.4",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0.0",
]
compression = [
  "py7zr>=0.20.0",
]
all = [
  "py7zr>=0.20.0",
  "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
resurrectum = "resurrectum.cli:main"
summon-validate-examples = "resurrectum.summon.scripts.validate_examples:main"

[build-system]
requires = ["hatchling>=1.24.2"]
build-backend = "hatchling.build"
